# Connect this repository as a Blueprint in the Render dashboard.
# Free plans are for evaluation; review limits and database expiry before production use.
services:
  - type: web
    name: superdarter-backend
    runtime: docker
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: POSTGRES_HOST
        fromDatabase:
          name: superdarter-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: superdarter-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: superdarter-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: superdarter-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: superdarter-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      # Public frontend origin, e.g. https://your-frontend.onrender.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: superdarter-frontend
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Public HTTPS backend URL, not Render's private hostname.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: superdarter-db
    region: frankfurt
    plan: free
    postgresMajorVersion: '16'
    databaseName: superdarter
    user: superdarter
    ipAllowList: []
